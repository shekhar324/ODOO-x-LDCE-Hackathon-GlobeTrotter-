<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobeTrotter AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen">

  <!-- Header -->
  <header class="p-4 border-b border-slate-800 bg-slate-950 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🌍</span>
      <h1 class="font-bold text-lg tracking-wide text-white">GlobeTrotter AI</h1>
    </div>
    <span class="text-xs text-slate-400 bg-slate-800 px-2.5 py-1 rounded-full border border-slate-700">Gemini 2.5 Flash</span>
  </header>

  <!-- Chat Messages Window -->
  <div id="chat-window" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 max-w-4xl w-full mx-auto">
    <div class="text-left">
      <div class="inline-block bg-slate-800 border border-slate-700 p-4 rounded-2xl max-w-[85%] text-slate-200">
        👋 Hello! I am your AI travel concierge. Ask me about travel itineraries, peak vs. off-season advice, cost estimations, transit hacks, or hidden gems anywhere in the world!
      </div>
    </div>
  </div>

  <!-- Input Form Area -->
  <div class="p-4 border-t border-slate-800 bg-slate-950">
    <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
      <input 
        id="user-input" 
        type="text" 
        placeholder="Ask anything (e.g., Best and off-season months for Japan)..." 
        class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 transition-colors"
        required
        autocomplete="off"
      >
      <button 
        type="submit" 
        id="send-btn"
        class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition duration-150 ease-in-out disabled:opacity-50"
      >
        Send
      </button>
    </form>
  </div>

  <!-- Chat JavaScript -->
  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const chatWindow = document.getElementById('chat-window');
    const sendBtn = document.getElementById('send-btn');

    form.onsubmit = async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      // Append User message
      chatWindow.innerHTML += `
        <div class="text-right">
          <div class="inline-block bg-blue-600 text-white p-3.5 rounded-2xl max-w-[85%] text-left">
            ${escapeHtml(message)}
          </div>
        </div>
      `;
      input.value = '';
      input.disabled = true;
      sendBtn.disabled = true;
      chatWindow.scrollTop = chatWindow.scrollHeight;

      // Loading bubble
      const loadingId = 'loading-' + Date.now();
      chatWindow.innerHTML += `
        <div id="${loadingId}" class="text-left">
          <div class="inline-block bg-slate-800 border border-slate-700 p-3.5 rounded-2xl text-slate-400 animate-pulse">
            Thinking...
          </div>
        </div>
      `;
      chatWindow.scrollTop = chatWindow.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message })
        });
        const data = await res.json();
        
        document.getElementById(loadingId)?.remove();

        chatWindow.innerHTML += `
          <div class="text-left">
            <div class="inline-block bg-slate-800 border border-slate-700 p-4 rounded-2xl max-w-[85%] whitespace-pre-wrap text-slate-200">
              ${escapeHtml(data.reply || data.error || 'No response.')}
            </div>
          </div>
        `;
      } catch (err) {
        document.getElementById(loadingId)?.remove();
        chatWindow.innerHTML += `
          <div class="text-left">
            <div class="inline-block bg-red-900/60 border border-red-700 p-3.5 rounded-2xl text-red-200">
              Failed to connect to the server.
            </div>
          </div>
        `;
      } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }
    };

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
